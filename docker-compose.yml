services:
  db:
    image: pgvector/pgvector:pg15
    container_name: laserclaw_db
    environment:
      POSTGRES_USER: laserclaw
      POSTGRES_PASSWORD: laserclaw123
      POSTGRES_DB: laserclaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laserclaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laserclaw_backend
    environment:
      DATABASE_URL: postgresql://laserclaw:laserclaw123@db:5432/laserclaw
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: 10485760
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      ANTHROPIC_TEMPERATURE: ${ANTHROPIC_TEMPERATURE:-0.2}
      AUTO_CREATE_TABLES: "false"
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      API_KEY: ${API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laserclaw_frontend
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  postgres_data:
  backend_uploads:
